<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAR Analysis — Arctic Shadow Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Exo+2:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Leaflet (same version Folium bundles for the main map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/analysis.css') }}">
</head>
<body>
    <div class="analysis-shell">
        <header class="analysis-header">
            <div class="analysis-header__title">
                <h1>SAR Analysis</h1>
                <div class="analysis-header__subtitle" id="analysis-subtitle">Loading SAR tiles &amp; AIS…</div>
            </div>
            <div class="analysis-header__stats" id="analysis-stats"></div>
            <button class="analysis-header__close" id="analysis-close" type="button" aria-label="Close analysis view">×</button>
        </header>

        <aside class="analysis-sidebar" id="analysis-sidebar">
            <div class="analysis-sidebar__section">
                <h2 class="analysis-sidebar__heading">Layers</h2>
                <label class="layer-toggle"><input type="checkbox" id="layer-tiles" checked> SAR Tiles</label>
                <label class="layer-toggle"><input type="checkbox" id="layer-vessels" checked> AIS Vessels</label>
                <label class="layer-toggle"><input type="checkbox" id="layer-detections" checked> CFAR Detections</label>
                <label class="layer-toggle"><input type="checkbox" id="layer-bboxes"> Bounding Boxes</label>
            </div>
            <div class="analysis-sidebar__section">
                <h2 class="analysis-sidebar__heading">Filter Detections</h2>
                <label class="layer-toggle"><input type="checkbox" id="filter-matched" checked> Show matched</label>
                <label class="layer-toggle"><input type="checkbox" id="filter-dark" checked> Show dark vessels</label>
                <div class="filter-slider">
                    <label for="filter-confidence">Min confidence: <strong id="confidence-value">4&#963;+</strong></label>
                    <input type="range" id="filter-confidence" min="4" max="30" value="4" step="1">
                </div>
            </div>
            <div class="analysis-sidebar__section">
                <h2 class="analysis-sidebar__heading">Filter AIS</h2>
                <label class="layer-toggle"><input type="checkbox" id="ais-russia" data-ais-cat="russia" checked><span class="legend__dot" style="background:#d32f2f"></span>Russia</label>
                <label class="layer-toggle"><input type="checkbox" id="ais-china" data-ais-cat="china" checked><span class="legend__dot" style="background:#ff9800"></span>China</label>
                <label class="layer-toggle"><input type="checkbox" id="ais-shadow" data-ais-cat="shadow_fleet" checked><span class="legend__dot" style="background:#c62828"></span>Shadow Fleet</label>
                <label class="layer-toggle"><input type="checkbox" id="ais-suspected" data-ais-cat="suspected_shadow" checked><span class="legend__dot" style="background:#ff5722"></span>Suspected Shadow</label>
                <label class="layer-toggle"><input type="checkbox" id="ais-norway-mil" data-ais-cat="norway_mil"><span class="legend__dot" style="background:#2E7D32"></span>Norway Mil / Law</label>
                <label class="layer-toggle"><input type="checkbox" id="ais-norway" data-ais-cat="norway"><span class="legend__dot" style="background:#888888"></span>Norway Civilian</label>
                <label class="layer-toggle"><input type="checkbox" id="ais-other" data-ais-cat="other"><span class="legend__dot" style="background:#2196F3"></span>Other</label>
                <label class="layer-toggle"><input type="checkbox" id="ais-buoy" data-ais-cat="buoy"><span class="legend__dot" style="background:#616161"></span>Buoy</label>
                <div class="detection-legend">
                    <span class="legend__dot" style="background:#4CAF50"></span>Matched
                    <span class="legend__dot legend__dot--pulse" style="background:#b86ff0"></span>Dark
                    <span class="legend__dot" style="background:#ff5252"></span>Critical
                </div>
            </div>
            <div class="analysis-sidebar__section">
                <h2 class="analysis-sidebar__heading">SAR Tiles</h2>
                <div class="analysis-sidebar__toolbar">
                    <button type="button" class="analysis-mini-btn" id="tiles-all">All</button>
                    <button type="button" class="analysis-mini-btn" id="tiles-none">None</button>
                </div>
                <ul class="tile-list" id="tile-list">
                    <li class="tile-list__empty">Loading…</li>
                </ul>
            </div>
        </aside>

        <div class="analysis-map" id="analysis-map"></div>
    </div>

    <script src="{{ url_for('static', filename='js/analysis.js') }}"></script>
</body>
</html>
