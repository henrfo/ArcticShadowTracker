name: Satellite Imagery Monitor

on:
  schedule:
    - cron: '0 0 * * *'   # Daily at midnight UTC (SAR imagery updates less frequently than AIS)
  workflow_dispatch:       # Manual trigger for testing

permissions:
  contents: write

jobs:
  collect-satellite:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Satellite imagery can take longer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow — gh-pages history isn't needed here.
                          # Avoids the 20-min hang we hit on arctic_monitor.yml.

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect Sentinel-1 SAR imagery
        id: collect
        env:
          SENTINEL_CLIENT_ID: ${{ secrets.SENTINEL_CLIENT_ID }}
          SENTINEL_CLIENT_SECRET: ${{ secrets.SENTINEL_CLIENT_SECRET }}
        run: |
          python scripts/collect_satellite.py

      - name: Detect vessels via CFAR
        run: |
          python scripts/detect_vessels_cfar.py

      - name: Correlate detections with AIS (emit dark_vessel anomalies)
        run: |
          python scripts/correlate_detections.py

      - name: Show metadata on failure for quick debugging
        if: failure()
        run: |
          echo "=== satellite pipeline FAILED ==="
          if [ -f data/satellite_imagery/metadata.json ]; then
            echo "Last metadata.json on disk:"
            cat data/satellite_imagery/metadata.json
          else
            echo "No metadata.json present"
          fi
          echo "=== Tile directory ==="
          ls -la data/satellite_imagery/tiles/ 2>/dev/null || echo "(no tiles dir)"
          echo "=== Detections (if any) ==="
          if [ -f data/satellite_imagery/detections.json ]; then
            head -50 data/satellite_imagery/detections.json
          fi

      - name: Commit metadata + thumbnails + detections + dark vessels
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          echo "=== Thumbnails directory contents ==="
          ls -la data/satellite_imagery/thumbnails/ 2>&1 || echo "(dir does not exist)"
          echo ""

          # Commit metadata.json + thumbnails + CFAR detections + dark vessels.
          # TIFF files in tiles/ are excluded by .gitignore.
          git add data/satellite_imagery/metadata.json
          if [ -d data/satellite_imagery/thumbnails ]; then
            git add -v data/satellite_imagery/thumbnails/
          else
            echo "No thumbnails directory to add"
          fi
          if [ -f data/satellite_imagery/detections.json ]; then
            git add data/satellite_imagery/detections.json
          fi
          if [ -f data/anomalies/dark_vessels.json ]; then
            git add data/anomalies/dark_vessels.json
          fi

          echo ""
          echo "=== Staged changes ==="
          git diff --staged --stat

          if git diff --staged --quiet; then
            echo "No changes to satellite metadata or thumbnails"
          else
            git commit -m "Satellite imagery update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
