name: Arctic Shadow Tracker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-vessels:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - run: pip install -r requirements.txt
        
    - name: Run tracker
      env:
        BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}
      run: python arctic_shadow_streamer.py test
        
    - name: Commit results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add arctic_intelligence/
        if [ -n "$(git status --porcelain)" ]; then
          git commit -m "Arctic surveillance update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
        fi