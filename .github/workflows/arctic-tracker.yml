name: Arctic Shadow Tracker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-vessels:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - run: pip install -r requirements.txt
        
    - name: Collect AIS data
      env:
        BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}
      run: python scripts/collect_ais.py
        
    - name: Commit and push
      run: |
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add outputs/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Arctic surveillance update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
        fi