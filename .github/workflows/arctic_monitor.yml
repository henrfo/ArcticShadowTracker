name: Arctic AIS Monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes
  workflow_dispatch:         # Manual trigger for testing
  push:
    branches: [main]         # Also run on push to main (for testing)

jobs:
  collect:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Allow pushing changes back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for tracking

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect AIS data
        env:
          BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}
        run: |
          python scripts/collect_ais.py

      - name: Copy vessel_tracks.json to outputs for GitHub Pages
        run: |
          cp data/vessel_tracks.json outputs/vessel_tracks.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./outputs
          publish_branch: gh-pages
          force_orphan: true  # Keep gh-pages branch clean
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
