name: Arctic AIS Monitor

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Allow scheduled runs to queue properly

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes
  workflow_dispatch:         # Manual trigger for testing

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Prevent indefinite hangs

    permissions:
      contents: write  # Allow pushing changes back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for tracking

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch previous snapshots from gh-pages
        run: |
          # Fetch gh-pages branch (last 50 commits to get recent snapshots)
          git fetch origin gh-pages --depth=50 2>/dev/null || echo "No gh-pages branch yet (first run)"

          # Restore snapshots if gh-pages exists
          if git rev-parse origin/gh-pages >/dev/null 2>&1; then
            echo "Restoring snapshots from gh-pages..."
            git checkout origin/gh-pages -- data/snapshots/ 2>/dev/null || echo "No snapshots directory yet"

            # Count restored snapshots
            SNAPSHOT_COUNT=$(ls -1 data/snapshots/*.json 2>/dev/null | wc -l | tr -d ' ')
            echo "Restored $SNAPSHOT_COUNT snapshot files from gh-pages"
          else
            echo "First run - no previous snapshots available"
            mkdir -p data/snapshots
          fi

      - name: Collect AIS data
        env:
          BARENTSWATCH_CLIENT_SECRET: ${{ secrets.BARENTSWATCH_CLIENT_SECRET }}
        run: |
          python scripts/collect_ais.py

      - name: Detect AIS Anomalies
        run: |
          python scripts/suspicious_activity_detection/detect_anomalies.py

      - name: Copy data to outputs for GitHub Pages
        run: |
          # Copy vessel tracks
          cp data/vessel_tracks.json outputs/vessel_tracks.json

          # Copy snapshots for persistence
          mkdir -p outputs/data/snapshots
          cp data/snapshots/*.json outputs/data/snapshots/ 2>/dev/null || echo "No snapshots to copy (first run)"

          # Copy anomaly detection files (rolling 7-day data)
          mkdir -p outputs/data/anomalies
          if [ -f data/anomalies/anomalies.json ]; then
            cp data/anomalies/anomalies.json outputs/data/anomalies/
            echo "Deploying anomalies.json to gh-pages"
          else
            echo "No anomalies JSON found (first run or no detections)"
          fi
          # Also copy CSV for debugging/analysis
          if [ -f data/anomalies/anomalies.csv ]; then
            cp data/anomalies/anomalies.csv outputs/data/anomalies/
          fi

          # Count what we're deploying
          SNAPSHOT_COUNT=$(ls -1 outputs/data/snapshots/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "Deploying $SNAPSHOT_COUNT snapshots to gh-pages"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./outputs
          publish_branch: gh-pages
          force_orphan: false  # Preserve gh-pages history for snapshot persistence
          keep_files: false    # Replace outputs on each deploy, but keep git history
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
