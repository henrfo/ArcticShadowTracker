# Role-Based Access Control for Arctic Shadow Tracker
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arctic-tracker-sa
  namespace: arctic-surveillance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: arctic-surveillance
  name: arctic-tracker-role
rules:
# Allow reading own configuration
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
# Allow reading own service endpoints
- apiGroups: [""]
  resources: ["endpoints", "services"]
  verbs: ["get", "list"]
# Allow updating own status
- apiGroups: ["apps"]
  resources: ["deployments/status"]
  verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arctic-tracker-rolebinding
  namespace: arctic-surveillance
subjects:
- kind: ServiceAccount
  name: arctic-tracker-sa
  namespace: arctic-surveillance
roleRef:
  kind: Role
  name: arctic-tracker-role
  apiGroup: rbac.authorization.k8s.io
---
# Network policies for security isolation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arctic-tracker-netpol
  namespace: arctic-surveillance
spec:
  podSelector:
    matchLabels:
      app: arctic-tracker
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from monitoring systems
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8000
  # Allow ingress from load balancer
  - from:
    - podSelector:
        matchLabels:
          app: nginx
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow egress to databases
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow egress to external APIs (Copernicus, AIS feeds)
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
---
# Pod Security Policy
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: arctic-tracker-psp
  namespace: arctic-surveillance
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'secret'
    - 'persistentVolumeClaim'
    - 'emptyDir'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  runAsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 2000
  seLinux:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 2000
  readOnlyRootFilesystem: true