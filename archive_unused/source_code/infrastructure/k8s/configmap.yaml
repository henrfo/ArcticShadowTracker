apiVersion: v1
kind: ConfigMap
metadata:
  name: arctic-tracker-config
  namespace: arctic-surveillance
data:
  # Application configuration
  LOG_LEVEL: "INFO"
  DATA_REFRESH_INTERVAL: "1800"  # 30 minutes
  ALERT_THRESHOLD_CRITICAL: "2.0"  # km from cable
  ALERT_THRESHOLD_HIGH: "5.0"     # km from cable
  
  # Arctic surveillance area bounds
  ARCTIC_BOUNDS_NORTH: "82.0"
  ARCTIC_BOUNDS_SOUTH: "69.0"
  ARCTIC_BOUNDS_EAST: "35.0"
  ARCTIC_BOUNDS_WEST: "5.0"
  
  # Processing parameters
  VESSEL_SIZE_THRESHOLD: "15"      # meters
  CONFIDENCE_THRESHOLD: "0.5"
  MATCHING_THRESHOLD_METERS: "1000"
  
  # Operational settings
  MAX_PARALLEL_DOWNLOADS: "4"
  SATELLITE_RETENTION_DAYS: "7"
  AIS_RETENTION_HOURS: "48"
  
  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # PostgreSQL configuration
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "arctic_surveillance"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: arctic-surveillance
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - "arctic_surveillance_rules.yml"
    
    scrape_configs:
      - job_name: 'arctic-tracker'
        static_configs:
          - targets: ['arctic-tracker-service:8000']
        metrics_path: /metrics
        scrape_interval: 30s
        
      - job_name: 'postgres'
        static_configs:
          - targets: ['postgres-exporter:9187']
          
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
    
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093