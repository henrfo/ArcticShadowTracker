# Arctic Shadow Tracker - Development and Testing Environment
version: '3.8'

services:
  # Core surveillance pipeline
  arctic-tracker:
    build: .
    container_name: arctic-tracker-core
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      - DATA_REFRESH_INTERVAL=1800  # 30 minutes
      - DATA_PERSISTENCE_ENABLED=1
      - VISUALIZATION_ENABLED=1
      - METRICS_ENABLED=1
      - HEALTH_CHECK_ENABLED=1
      - EMAIL_ALERTS_ENABLED=${EMAIL_ALERTS_ENABLED:-false}
      - WEBHOOK_ALERTS_ENABLED=${WEBHOOK_ALERTS_ENABLED:-false}
      - SLACK_ALERTS_ENABLED=${SLACK_ALERTS_ENABLED:-false}
      - COPERNICUS_USERNAME=${COPERNICUS_USERNAME}
      - COPERNICUS_PASSWORD=${COPERNICUS_PASSWORD}
      - AIS_API_KEY=${AIS_API_KEY}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_TO=${EMAIL_TO}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SLACK_CHANNEL=${SLACK_CHANNEL}
    volumes:
      - arctic-data:/app/data
      - arctic-outputs:/app/outputs
      - arctic-logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - arctic-net
    ports:
      - "8000:8000"
      - "9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from infrastructure.deploy.health_monitor import docker_health_check; docker_health_check()"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 180s
    depends_on:
      - postgres
      - redis

  # Sentinel data downloader (scheduled service)
  sentinel-downloader:
    build: .
    container_name: arctic-sentinel-downloader
    command: ["python", "sentinel_downloader.py"]
    environment:
      - PYTHONPATH=/app
      - COPERNICUS_USERNAME=${COPERNICUS_USERNAME}
      - COPERNICUS_PASSWORD=${COPERNICUS_PASSWORD}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - arctic-net
    restart: "no"  # Run on-demand or via cron

  # Redis for caching and task queues
  redis:
    image: redis:7-alpine
    container_name: arctic-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - arctic-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL for operational data storage
  postgres:
    image: postgis/postgis:14-3.2
    container_name: arctic-postgres
    environment:
      - POSTGRES_DB=arctic_surveillance
      - POSTGRES_USER=arctic_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - arctic-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arctic_user -d arctic_surveillance"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: arctic-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - arctic-net
    ports:
      - "9090:9090"
    restart: unless-stopped

  # Grafana for monitoring dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: arctic-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./deploy/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
    networks:
      - arctic-net
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

  # Nginx reverse proxy and load balancer
  nginx:
    image: nginx:alpine
    container_name: arctic-nginx
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx
    networks:
      - arctic-net
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    depends_on:
      - arctic-tracker

networks:
  arctic-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:
  arctic-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
  arctic-outputs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./outputs
  arctic-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs