[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/app/tmp/supervisord.pid
childlogdir=/app/logs

[unix_http_server]
file=/app/tmp/supervisor.sock
chmod=0700
chown=arctic:arctic

[supervisorctl]
serverurl=unix:///app/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Main Arctic Shadow Tracker application
[program:arctic-tracker]
command=/usr/local/bin/python -m utils.daily_operations --continuous
directory=/app
user=arctic
autostart=true
autorestart=true
startsecs=10
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/arctic-tracker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"

# Prometheus metrics exporter
[program:metrics-exporter]
command=/usr/local/bin/python -m infrastructure.deploy.metrics_exporter
directory=/app
user=arctic
autostart=true
autorestart=true
startsecs=5
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/metrics-exporter.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"

# Alert system monitor
[program:alert-monitor]
command=/usr/local/bin/python -m infrastructure.deploy.alert_system --daemon
directory=/app
user=arctic
autostart=true
autorestart=true
startsecs=5
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/alert-monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"

# Health monitor
[program:health-monitor]
command=/usr/local/bin/python -m infrastructure.deploy.health_monitor --daemon
directory=/app
user=arctic
autostart=true
autorestart=true
startsecs=5
startretries=3
redirect_stderr=true
stdout_logfile=/app/logs/health-monitor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONPATH="/app",PYTHONUNBUFFERED="1"

# Cron daemon (for scheduled tasks)
[program:crond]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/app/logs/cron.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[group:arctic-services]
programs=arctic-tracker,metrics-exporter,alert-monitor,health-monitor
priority=999