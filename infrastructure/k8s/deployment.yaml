apiVersion: apps/v1
kind: Deployment
metadata:
  name: arctic-tracker-deployment
  namespace: arctic-surveillance
  labels:
    app: arctic-tracker
    tier: application
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: arctic-tracker
  template:
    metadata:
      labels:
        app: arctic-tracker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: arctic-tracker
        image: arctic-tracker:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: PYTHONPATH
          value: "/app"
        - name: PYTHONUNBUFFERED
          value: "1"
        envFrom:
        - configMapRef:
            name: arctic-tracker-config
        - secretRef:
            name: arctic-tracker-secrets
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: outputs-volume
          mountPath: /app/outputs
        - name: logs-volume
          mountPath: /app/logs
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: arctic-tracker-data-pvc
      - name: outputs-volume
        persistentVolumeClaim:
          claimName: arctic-tracker-outputs-pvc
      - name: logs-volume
        emptyDir: {}
      nodeSelector:
        workload-type: surveillance
      tolerations:
      - key: "surveillance-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-downloader-deployment
  namespace: arctic-surveillance
  labels:
    app: sentinel-downloader
    tier: data-ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-downloader
  template:
    metadata:
      labels:
        app: sentinel-downloader
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: sentinel-downloader
        image: arctic-tracker:latest
        command: ["python", "sentinel_downloader.py"]
        envFrom:
        - configMapRef:
            name: arctic-tracker-config
        - secretRef:
            name: arctic-tracker-secrets
        volumeMounts:
        - name: data-volume
          mountPath: /app/data
        - name: logs-volume
          mountPath: /app/logs
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: arctic-tracker-data-pvc
      - name: logs-volume
        emptyDir: {}
      restartPolicy: Always