# Persistent Volume Claims for Arctic Shadow Tracker
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arctic-tracker-data-pvc
  namespace: arctic-surveillance
  labels:
    app: arctic-tracker
    tier: storage
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods can access for HA
  storageClassName: fast-ssd  # Use SSD for satellite imagery processing
  resources:
    requests:
      storage: 500Gi  # Large storage for satellite imagery
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arctic-tracker-outputs-pvc
  namespace: arctic-surveillance
  labels:
    app: arctic-tracker
    tier: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 100Gi  # Storage for reports and alerts
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: arctic-surveillance
  labels:
    app: postgres
    tier: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 200Gi  # Database storage
---
